<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AcademiaLink | Forgot Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./css/style.css" />
    <script>
      if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    </script>
    <style>
      .error-msg { font-size: 0.65rem; color: #ef4444; margin-top: 4px; display: none; }
      .error-msg.show { display: block; }
      .field-error { border-color: #ef4444 !important; }
    </style>
  </head>

  <body class="bg-[#f9f9ff] dark:bg-[#0b0f19] text-[#151c27] dark:text-[#f3f4f6] font-sans antialiased min-h-screen flex flex-col">
    <div id="app-header"></div>

    <main class="flex-grow flex items-center justify-center p-4 py-12">
      <div class="bg-white dark:bg-gray-900 rounded-3xl border border-gray-100 dark:border-gray-800 p-8 max-w-md w-full shadow-xl space-y-6">

        <div class="text-center space-y-2">
          <div class="w-12 h-12 rounded-2xl bg-indigo-600 text-white flex items-center justify-center mx-auto shadow-md">
            <span class="material-symbols-outlined text-2xl">lock_reset</span>
          </div>
          <h1 class="text-2xl font-extrabold text-gray-900 dark:text-white font-headline">Forgot Password?</h1>
          <p class="text-xs text-gray-500 dark:text-gray-400">Enter your email and we'll send you a link to reset it.</p>
        </div>

        <form id="forgot-form" class="space-y-4" novalidate>
          <div>
            <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">
              Student Email Address *
            </label>
            <input
              type="email"
              id="forgot-email"
              required
              autocomplete="email"
              placeholder="e.g. student@buet.ac.bd"
              class="w-full px-4 py-3 rounded-xl bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none transition-all"
            />
            <p class="error-msg" id="email-error">Please enter a valid email address.</p>
          </div>

          <button
            type="submit"
            id="forgot-btn"
            class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed text-white font-bold rounded-xl text-xs shadow-md transition-all flex items-center justify-center gap-2"
          >
            <span id="btn-label">Send Reset Link</span>
          </button>
        </form>

        <p class="text-center text-xs text-gray-500">
          Remembered your password?
          <a href="./login.html" class="text-indigo-600 font-bold hover:underline">Back to Sign In</a>
        </p>
      </div>
    </main>

    <div id="app-footer"></div>

    <script type="module" src="./js/pages/forgot-password.js"></script>
  </body>
</html>
