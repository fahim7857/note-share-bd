<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password - AcademiaLink</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        .container {
            width: 90%;
            max-width: 420px;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            margin-top: 0;
        }

        p {
            text-align: center;
            color: #666;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
        }

        #message {
            margin-top: 20px;
            text-align: center;
        }

        .error {
            color: #dc2626;
        }

        .success {
            color: #16a34a;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Reset Password</h1>

    <p>Create a new password for your account.</p>

    <form id="resetForm">

        <label for="password">New Password</label>

        <input
            type="password"
            id="password"
            minlength="6"
            placeholder="Enter new password"
            required
        >

        <label for="confirmPassword">Confirm Password</label>

        <input
            type="password"
            id="confirmPassword"
            minlength="6"
            placeholder="Enter password again"
            required
        >

        <button type="submit" id="resetButton">
            Reset Password
        </button>

    </form>

    <div id="message"></div>

</div>

<script type="module">

    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    /*
     * USE THE SAME SUPABASE URL AND ANON KEY
     * THAT YOUR OTHER PROJECT JAVASCRIPT FILES USE.
     */

    const SUPABASE_URL = "https://btwzkhqiyausycbndlvq.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ0d3praHFpeWF1c3ljYm5kbHZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4MDAxMTUsImV4cCI6MjEwMDM3NjExNX0.DOwuZ64AH0PG9ZGoOlceD4_V2jpMrvHqVkfsiBbboDs";

    const supabase = createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );

    const form = document.getElementById("resetForm");
    const passwordInput = document.getElementById("password");
    const confirmPasswordInput =
        document.getElementById("confirmPassword");

    const button = document.getElementById("resetButton");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {

        event.preventDefault();

        const password = passwordInput.value;
        const confirmPassword = confirmPasswordInput.value;

        message.textContent = "";
        message.className = "";

        if (password.length < 6) {
            message.textContent =
                "Password must be at least 6 characters.";
            message.className = "error";
            return;
        }

        if (password !== confirmPassword) {
            message.textContent =
                "Passwords do not match.";
            message.className = "error";
            return;
        }

        const params = new URLSearchParams(
            window.location.search
        );

        const token = params.get("token");
        const email = params.get("email");

        if (!token || !email) {
            message.textContent =
                "Invalid or missing reset link.";
            message.className = "error";
            return;
        }

        button.disabled = true;
        button.textContent = "Resetting...";

        try {

            const { data, error } =
                await supabase.functions.invoke(
                    "reset-password",
                    {
                        body: {
                            token,
                            email,
                            password
                        }
                    }
                );

            if (error) {
                throw new Error(error.message);
            }

            if (!data || !data.success) {
                throw new Error(
                    data?.error || "Password reset failed."
                );
            }

            message.textContent =
                "Password reset successfully! Redirecting to login...";

            message.className = "success";

            setTimeout(() => {
                window.location.href = "/login.html";
            }, 2000);

        } catch (error) {

            console.error(error);

            message.textContent =
                error.message ||
                "Something went wrong.";

            message.className = "error";

            button.disabled = false;
            button.textContent = "Reset Password";
        }

    });

</script>

</body>
</html>
