<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AcademiaLink | Student Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./css/style.css" />
    <script>
      if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    </script>

    <style>
      /* Password toggle */
      .input-icon-wrap { position: relative; }
      .input-icon-wrap input { padding-right: 2.75rem; }
      .toggle-pw {
        position: absolute;
        right: 0.75rem;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        cursor: pointer;
        color: #9ca3af;
        display: flex;
        align-items: center;
        padding: 0;
        transition: color 0.2s;
      }
      .toggle-pw:hover { color: #6366f1; }

      /* Error shake */
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20%       { transform: translateX(-6px); }
        40%       { transform: translateX(6px); }
        60%       { transform: translateX(-4px); }
        80%       { transform: translateX(4px); }
      }
      .shake { animation: shake 0.4s ease; }

      /* Field error highlight */
      .field-error {
        border-color: #ef4444 !important;
        ring-color: #ef4444 !important;
      }
      .error-msg {
        font-size: 0.65rem;
        color: #ef4444;
        margin-top: 4px;
        display: none;
      }
      .error-msg.show { display: block; }
    </style>
  </head>

  <body class="bg-[#f9f9ff] dark:bg-[#0b0f19] text-[#151c27] dark:text-[#f3f4f6] font-sans antialiased min-h-screen flex flex-col">
    <!-- Header -->
    <div id="app-header"></div>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center p-4 py-12">
      <div class="bg-white dark:bg-gray-900 rounded-3xl border border-gray-100 dark:border-gray-800 p-8 max-w-md w-full shadow-xl space-y-6">

        <!-- Title block — unchanged -->
        <div class="text-center space-y-2">
          <div class="w-12 h-12 rounded-2xl bg-indigo-600 text-white flex items-center justify-center mx-auto shadow-md">
            <span class="material-symbols-outlined text-2xl">school</span>
          </div>
          <h1 class="text-2xl font-extrabold text-gray-900 dark:text-white font-headline">Welcome Back</h1>
          <p class="text-xs text-gray-500 dark:text-gray-400">Sign in with your university account to upload & save course notes.</p>
        </div>

        <form id="login-form" class="space-y-4" novalidate>

          <!-- Email -->
          <div>
            <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">
              Student Email Address *
            </label>
            <input
              type="email"
              id="login-email"
              required
              autocomplete="email"
              placeholder="e.g. student@buet.ac.bd"
              class="w-full px-4 py-3 rounded-xl bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none transition-all"
            />
            <p class="error-msg" id="email-error">Please enter a valid email address.</p>
          </div>

          <!-- Password -->
          <div>
            <div class="flex items-center justify-between mb-1">
              <label class="block text-xs font-bold text-gray-700 dark:text-gray-300">
                Password *
              </label>
              <a href="./forgot-password.html" class="text-[10px] text-indigo-500 hover:underline">Forgot password?</a>
            </div>
            <div class="input-icon-wrap">
              <input
                type="password"
                id="login-password"
                required
                autocomplete="current-password"
                placeholder="••••••••"
                class="w-full px-4 py-3 rounded-xl bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none transition-all"
              />
              <button type="button" class="toggle-pw" data-target="login-password" aria-label="Toggle password">
                <span class="material-symbols-outlined" style="font-size:18px;">visibility</span>
              </button>
            </div>
            <p class="error-msg" id="pw-error">Incorrect email or password.</p>
          </div>

          <!-- Submit -->
          <button
            type="submit"
            id="login-btn"
            class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed text-white font-bold rounded-xl text-xs shadow-md transition-all flex items-center justify-center gap-2"
          >
            <span id="btn-label">Sign In to Account</span>
          </button>
        </form>

        <p class="text-center text-xs text-gray-500">
          Don't have an account yet?
          <a href="./register.html" class="text-indigo-600 font-bold hover:underline">Register here</a>
        </p>
      </div>
    </main>

    <!-- Footer -->
    <div id="app-footer"></div>

    <script type="module" src="./js/pages/login.js"></script>
  </body>
</html>
